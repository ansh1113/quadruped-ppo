# Training Configuration for Quadruped PPO

# Environment Settings
environment:
  terrain_type: 'flat'  # Options: flat, uneven, stairs, slopes, mixed
  terrain_difficulty: 0.5  # Range: 0.0 to 1.0
  max_episode_steps: 1000
  control_freq: 50  # Hz
  render: false

# PPO Hyperparameters
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

# Training Settings
training:
  total_timesteps: 1000000
  save_freq: 50000
  eval_freq: 10000
  n_eval_episodes: 5
  save_path: 'models/quadruped'
  log_dir: 'logs/'
  tensorboard_log: 'logs/tensorboard/'
  verbose: 1

# Curriculum Learning (Optional)
curriculum:
  enabled: false
  stages:
    - name: 'stage1'
      terrain: 'flat'
      difficulty: 0.0
      timesteps: 500000
    
    - name: 'stage2'
      terrain: 'uneven'
      difficulty: 0.3
      timesteps: 500000
    
    - name: 'stage3'
      terrain: 'mixed'
      difficulty: 0.5
      timesteps: 1000000

# Evaluation Settings
evaluation:
  n_episodes: 10
  deterministic: true
  render: false
  save_metrics: true
  metrics_path: 'results/metrics.json'
